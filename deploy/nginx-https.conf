server {
    listen 443 ssl;
    server_name 191.252.155.205;
    ssl_certificate /etc/letsencrypt/live/191.252.155.205/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/191.252.155.205/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AprenderTLS:10m;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
