services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: escola_local
      POSTGRES_DB: escola
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - escola_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola"]
      interval: 3s
      retries: 15
volumes:
  escola_db:
